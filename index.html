<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graf Yolu: Ağ Kurucuları - TEKNOFEST</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 10px;
            user-select: none;
        }
        h1 {
            font-size: 16px;
            color: #4CAF50;
            margin: 5px 0;
        }
        #info {
            font-size: 13px;
            color: #bbb;
            margin-bottom: 10px;
        }
        #game-container {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 0 auto;
            background: #2a2a2a;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid #444;
        }
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .node {
            position: absolute;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: all 0.2s;
        }
        .node.selected {
            border-color: #FFEB3B;
            box-shadow: 0 0 10px #FFEB3B;
        }
        .node.visited {
            background-color: #81C784;
        }
        .controls {
            margin-top: 15px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:active {
            background-color: #388E3C;
        }
    </style>
</head>
<body>
    <h1>GRAF YOLU: AĞ KURUCULARI</h1>
    <div id="info">Seviye 1 | Renk: Kırmızı | Hedef: Tüm düğümleri gez!</div>

    <div id="game-container">
        <svg id="svg-lines"></svg>
    </div>

    <div class="controls">
        <button onclick="resetGame()">Yeniden Başla</button>
    </div>

    <script>
        const levels = [
            { level: 1, colorName: "Kırmızı", color: "#F44336", nodes: 5 },
            { level: 2, colorName: "Mavi & Kırmızı", color: "#2196F3", nodes: 8 },
            { level: 3, colorName: "Süper Gökkuşağı (6 Renk)", color: "#FF9800", nodes: 12 }
        ];

        let currentLevelIndex = 0;
        let nodesData = [];
        let edgesData = [];
        let selectedNode = null;
        let drawnEdges = [];

        const container = document.getElementById('game-container');
        const svgLines = document.getElementById('svg-lines');
        const infoDiv = document.getElementById('info');

        function initLevel() {
            container.innerHTML = '<svg id="svg-lines"></svg>';
            svgLines.innerHTML = '';
            nodesData = [];
            edgesData = [];
            selectedNode = null;
            drawnEdges = [];

            const lvl = levels[currentLevelIndex];
            infoDiv.innerText = `Seviye ${lvl.level} | Renk Modu: ${lvl.colorName} | Hedef: Noktaları birleştir!`;

            // Düğümleri (Node) rastgele ama düzenli yerleştir
            const count = lvl.nodes;
            const radius = 120;
            const centerX = 175;
            const centerY = 175;

            for (let i = 0; i < count; i++) {
                const angle = (i * 2 * Math.PI) / count;
                const x = centerX + radius * Math.cos(angle) + (Math.random() * 20 - 10);
                const y = centerY + radius * Math.sin(angle) + (Math.random() * 20 - 10);
                
                nodesData.push({ id: i + 1, x: x, y: y });

                const div = document.createElement('div');
                div.className = 'node';
                div.innerText = i + 1;
                div.style.left = `${x}px`;
                div.style.top = `${y}px`;
                div.onclick = () => handleNodeClick(i + 1, div);
                container.appendChild(div);
            }

            // Komşuluk kenarları oluştur
            for (let i = 0; i < count; i++) {
                for (let j = i + 1; j < count; j++) {
                    const dist = Math.hypot(nodesData[i].x - nodesData[j].x, nodesData[i].y - nodesData[j].y);
                    if (dist < 130) {
                        edgesData.push({ from: i + 1, to: j + 1 });
                    }
                }
            }
        }

        function handleNodeClick(id, element) {
            if (!selectedNode) {
                selectedNode = id;
                element.classList.add('selected');
            } else {
                if (selectedNode !== id) {
                    // Kenar geçerli mi kontrol et (komşu mu?)
                    const isValidConnection = edgesData.some(e => 
                        (e.from === selectedNode && e.to === id) || (e.from === id && e.to === selectedNode)
                    );

                    if (isValidConnection) {
                        const n1 = nodesData.find(n => n.id === selectedNode);
                        const n2 = nodesData.find(n => n.id === id);

                        // Çizgi çiz
                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', n1.x);
                        line.setAttribute('y1', n1.y);
                        line.setAttribute('x2', n2.x);
                        line.setAttribute('y2', n2.y);
                        line.setAttribute('stroke', levels[currentLevelIndex].color);
                        line.setAttribute('stroke-width', '4');
                        svgLines.appendChild(line);

                        element.classList.add('visited');
                        
                        // Sonraki seviyeye geçiş kontrolü
                        if (currentLevelIndex < levels.length - 1) {
                            currentLevelIndex++;
                            setTimeout(() => {
                                alert("Tebrikler! Sonraki seviyeye geçiliyor...");
                                initLevel();
                            }, 300);
                        } else {
                            setTimeout(() => {
                                alert("Tebrikler! Tüm seviyeleri başarıyla tamamladın!");
                                currentLevelIndex = 0;
                                initLevel();
                            }, 300);
                        }
                    }
                }
                // Seçimi temizle
                document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
                selectedNode = null;
            }
        }

        function resetGame() {
            initLevel();
        }

        initLevel();
    </script>
</body>
</html>
