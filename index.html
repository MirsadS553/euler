<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euler Yolu - Grafik Teorisi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f111a;
            color: #f8fafc;
            text-align: center;
            margin: 0;
            padding: 15px;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 350px;
        }

        h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #38bdf8;
            margin: 0 0 6px 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        #level-info {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .btn-rules {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }

        #game-container {
            position: relative;
            width: 340px;
            height: 340px;
            background: #fdfbf7;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 2px solid #8c6d53;
            overflow: hidden;
        }
        svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        .node {
            position: absolute;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #fff8eb;
            border: 3px solid #8c6d53;
            box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px #8c6d53;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            color: #4a3525;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: transform 0.15s, background-color 0.2s;
        }
        .node.active {
            background-color: #ffeb3b !important;
            border-color: #d97706 !important;
            transform: translate(-50%, -50%) scale(1.15);
            box-shadow: 0 0 12px #ffeb3b;
        }
        .node.start-node { background-color: #4CAF50 !important; color: #fff !important; }
        .node.finish-node { background-color: #F44336 !important; color: #fff !important; }
        .node.visited { background-color: #b0bec5 !important; color: #333 !important; }

        .footer-scores {
            width: 100%;
            max-width: 340px;
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 13px;
            font-weight: 600;
