<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gökkuşağı Rotası - İmkansız Seviye</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 15px;
            user-select: none;
        }
        h1 {
            color: #333;
            font-size: 18px;
            margin-bottom: 5px;
        }
        p {
            color: #666;
            font-size: 12px;
            margin-top: 0;
        }
        #game-container {
            position: relative;
            width: 340px;
            height: 340px;
            margin: 15px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .node {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #8b5a2b;
            box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px #8b5a2b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        .start-node {
            background-color: #4CAF50 !important;
            color: white;
        }
        .finish-node {
            background-color: #F44336 !important;
            color: white;
        }
    </style>
</head>
<body>
    <h1>İMKANSIZ SEVİYE - 6 RENKLİ SÜPER GÖKKUŞAĞI</h1>
    <p>Kural: 6 renk, her renk 1 kademe! Start (1) -> Finish (25)</p>

    <div id="game-container">
        <svg id="svg-edges"></svg>
    </div>

    <script>
        const container = document.getElementById('game-container');
        const gridLines = 5;
        const spacing = 340 / (gridLines + 1);

        for (let row = 0; row < 5; row++) {
            for (let col = 0; col < 5; col++) {
                const id = (4 - row) * 5 + col + 1;
                const node = document.createElement('div');
                node.className = 'node';
                if (id === 1) node.classList.add('start-node');
                if (id === 25) node.classList.add('finish-node');
                node.innerText = id;
                node.style.left = `${(col + 1) * spacing}px`;
                node.style.top = `${(row + 1) * spacing}px`;
                container.appendChild(node);
            }
        }
    </script>
</body>
</html>
