<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gökkuşağı Rotası</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f111a;
            color: #f8fafc;
            text-align: center;
            margin: 0;
            padding: 15px;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            max-width: 350px;
        }

        h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #38bdf8;
            margin: 0 0 8px 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        #level-info {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .btn-rules {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }

        .color-tracker {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 12px;
            width: 100%;
            max-width: 350px;
            background: #1e293b;
            padding: 8px;
            border-radius: 12px;
            min-height: 32px;
            flex-wrap: wrap;
        }
        .color-badge {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            opacity: 0.3;
            border: 2px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }
        .color-badge.used {
            opacity: 1;
            transform: scale(1.2);
            border-color: #fff;
            box-shadow: 0 0 8px rgba(255,255,255,0.5);
        }

        #game-container {
            position: relative;
            width: 340px;
            height: 340px;
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            overflow: hidden;
        }
        svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        .node {
            position: absolute;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #0f111a;
            border: 2px solid #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: #cbd5e1;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: transform 0.15s, background-color 0.2s;
        }
        .node.active {
            background-color: #38bdf8 !important;
            border-color: #fff !important;
            color: #0f111a !important;
            transform: translate(-50%, -50%) scale(1.15);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }
        .node.start-node { background-color: #10b981; border-color: #34d399; color: #fff; }
        .node.finish-node { background-color: #f43f5e; border-color: #fb7185; color: #fff; }
        .node.visited { background-color: #334155; border-color: #64748b; color: #94a3b8; }

        footer {
            margin-top: 15px;
            font-size: 13px;
            color: #64748b;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 17, 26, 0.85);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #1e293b;
            color: #f8fafc;
            width: 100%;
            max-width: 340px;
            padding: 24px;
            border-radius: 16px;
            text-align: left;
            border: 1px solid #334155;
        }
        .modal-content h2 { margin-top: 0; color: #38bdf8; font-size: 16px; }
        .modal-content ul { padding-left: 18px; font-size: 13px; line-height: 1.5; color: #cbd5e1; }
        .close-btn {
            background: #38bdf8;
            color: #0f111a;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>GÖKKUŞAĞI ROTASI</h1>
        <div class="top-bar">
            <div id="level-info">Seviye 1</div>
            <button class="btn-rules" onclick="openRules()">Kurallar</button>
        </div>
        <div class="color-tracker" id="colorTracker"></div>
    </header>

    <div id="game-container">
        <svg id="svg-edges"></svg>
    </div>

    <footer>
        Adım: <span id="step-count">0</span>
    </footer>

    <div id="rulesModal" class="modal">
        <div class="modal-content">
            <h2>Oyun Kuralları</h2>
            <ul>
                <li><b>Amaç:</b> 1 numaralı düğümden başlayıp 25 numaralı bitişe ulaşmak.</li>
                <li><b>Renk Kuralı:</b> Her renkten yalnızca <b>bir kez</b> geçebilirsin.</li>
                <li><b>Seviye Sistemi:</b> İlerledikçe renk çeşitliliği ve zorluk artar.</li>
                <li><b>Kaybetme:</b> Çıkmaz yola girersen <b>Level 1'e dönersin!</b></li>
            </ul>
            <button class="close-btn" onclick="closeRules()">Anladım</button>
        </div>
    </div>

    <script>
        const nodesPos = {};
        const container = document.getElementById('game-container');
        const svg = document.getElementById('svg-edges');
        
        const spacing = 340 / 6;
        for (let row = 0; row < 5; row++) {
            for (let col = 0; col < 5; col++) {
                const id = (4 - row) * 5 + col + 1;
                nodesPos[id] = { x: (col + 1) * spacing, y: (row + 1) * spacing };
            }
        }

        const baseEdges = [
            { f: 1, t: 2 }, { f: 1, t: 6 }, { f: 6, t: 7 }, { f: 11, t: 16 }, { f: 24, t: 25 },
            { f: 6, t: 11 }, { f: 7, t: 11 }, { f: 7, t: 12 }, { f: 7, t: 8 }, { f: 21, t: 22 }, { f: 22, t: 23 },
            { f: 3, t: 8 }, { f: 11, t: 12 }, { f: 12, t: 13 }, { f: 13, t: 14 }, { f: 17, t: 18 },
            { f: 4, t: 9 }, { f: 9, t: 14 }, { f: 13, t: 18 }, { f: 18, t: 14 }, { f: 18, t: 19 },
            { f: 5, t: 10 }, { f: 10, t: 15 }, { f: 19, t: 20 }, { f: 19, t: 24 },
            { f: 2, t: 3 }, { f: 15, t: 20 }, { f: 20, t: 25 }, { f: 23, t: 24 }
        ];

        let currentLevel = 1;
        let currentPos = 1;
        let visitedNodes = [1];
        let usedColors = [];
        let steps = 0;
        let levelColors = [];
        let levelEdges = [];

        function initLevelData() {
            const colorCount = Math.min(20, 3 + Math.floor((currentLevel - 1) * 0.35));
            levelColors = [];
            for (let i = 0; i < colorCount; i++) {
                const hue = Math.floor(i * (360 / colorCount));
                levelColors.push({ id: i, hex: `hsl(${hue}, 85%, 60%)` });
            }

            levelEdges = baseEdges.map((e, index) => {
                const colorIndex = index % levelColors.length;
                return { f: e.f, t: e.t, colorId: levelColors[colorIndex].id, hex: levelColors[colorIndex].hex };
            });
        }

        function renderMap() {
            initLevelData();
            svg.innerHTML = '';
            
            // Eski node'ları temizle
            const oldNodes = container.querySelectorAll('.node');
            oldNodes.forEach(n => n.remove());

            const tracker = document.getElementById('colorTracker');
            tracker.innerHTML = '';
            levelColors.forEach(c => {
                const badge = document.createElement('div');
                badge.className = 'color-badge';
                badge.style.backgroundColor = c.hex;
                if (usedColors.includes(c.id)) badge.classList.add('used');
                tracker.appendChild(badge);
            });

            document.getElementById('level-info').innerText = `Seviye ${currentLevel}`;

            // Çizgileri ekle
            levelEdges.forEach(e => {
                const p1 = nodesPos[e.f];
                const p2 = nodesPos[e.t];
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
                line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
                line.setAttribute('stroke', e.hex);
                line.setAttribute('stroke-width', '4');
                line.setAttribute('stroke-linecap', 'round');
                svg.appendChild(line);
            });

            // Düğümleri ekle
            for (let i = 1; i <= 25; i++) {
                const node = document.createElement('div');
                node.className = 'node';
                if (i === 1) node.classList.add('start-node');
                if (i === 25) node.classList.add('finish-node');
                if (i === currentPos) node.classList.add('active');
                else if (visitedNodes.includes(i)) node.classList.add('visited');

                node.innerText = i;
                node.style.left = `${nodesPos[i].x}px`;
                node.style.top = `${nodesPos[i].y}px`;
                node.onclick = () => moveToNode(i);
                container.appendChild(node);
            }

            checkGameOver();
        }

        function moveToNode(targetId) {
            if (currentPos === targetId) return;
